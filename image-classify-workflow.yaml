# image-classify-workflow.yaml
#
# Multi-stage Argo Workflow: Pretrained Image Classification with MobileNetV2
#
# Stages:
#   1. fetch      – download model (mobilenetv2-12.onnx), ImageNet labels,
#                   and sample images from Wikimedia Commons
#   2. preprocess – resize + centre-crop + normalise each image → .npy tensors
#   3. classify   – run ONNX Runtime inference, write results.json
#
# All stages share a single emptyDir volume (/workspace) so no external
# artifact store (S3/MinIO) is required for a self-contained demo.
# Each stage is a separate Kubernetes Pod.
#
# All stages use a single custom Docker image that includes dispatcher.py
# and all Python stage modules, eliminating the need for inline scripts or
# ConfigMap mounts.
#
# Prerequisites:
#   kubectl apply -n argo -f https://github.com/argoproj/argo-workflows/releases/latest/download/install.yaml
#
# Usage:
#   argo submit image-classify-workflow.yaml --watch
#   argo submit image-classify-workflow.yaml -p log_level=DEBUG --watch
#   argo submit image-classify-workflow.yaml -p docker_image=myregistry/classifier:1.0 --watch
#
# To swap in a different set of images, override the image_urls parameter.
#
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: image-classify-
  labels:
    demo: mobilenetv2-onnx
spec:
  # ── Global settings ──────────────────────────────────────────────────────────
  entrypoint: pipeline

  arguments:
    parameters:
      # Custom Docker image containing dispatcher.py and all stage modules
      - name: docker_image
        value: "python:3.11-slim"  # Replace with myregistry/classifier:1.0 for production
      # Python package versions – pin for reproducibility
      - name: onnxruntime_version
        value: "1.18.1"
      - name: pillow_version
        value: "10.3.0"
      # Logging level forwarded to all stages via LOG_LEVEL env var
      - name: log_level
        value: "INFO"

  # Shared volume: all three pods mount this at /workspace
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 500Mi   # model ~13 MB + images + tensors, headroom to spare

  # ── Top-level pipeline ───────────────────────────────────────────────────────
  templates:
    - name: pipeline
      steps:
        # Stage 1 runs first, alone
        - - name: fetch
            template: fetch-model-and-images

        # Stage 2 runs after Stage 1 completes
        - - name: preprocess
            template: preprocess-images

        # Stage 3 runs after Stage 2 completes
        - - name: classify
            template: classify-images

    # ── Stage 1: Fetch ──────────────────────────────────────────────────────────
    - name: fetch-model-and-images
      metadata:
        labels:
          stage: "1-fetch"
      container:
        image: "{{workflow.parameters.docker_image}}"
        command: [python, dispatcher.py]
        args:
          - --stage
          - fetch
          - --out-dir
          - /workspace/data
        env:
          - name: LOG_LEVEL
            value: "{{workflow.parameters.log_level}}"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

    # ── Stage 2: Preprocess ─────────────────────────────────────────────────────
    - name: preprocess-images
      metadata:
        labels:
          stage: "2-preprocess"
      container:
        image: "{{workflow.parameters.docker_image}}"
        command: [python, dispatcher.py]
        args:
          - --stage
          - preprocess
          - --in-dir
          - /workspace/data
          - --out-dir
          - /workspace/data
        env:
          - name: LOG_LEVEL
            value: "{{workflow.parameters.log_level}}"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1000m"

    # ── Stage 3: Classify ───────────────────────────────────────────────────────
    - name: classify-images
      metadata:
        labels:
          stage: "3-classify"
      container:
        image: "{{workflow.parameters.docker_image}}"
        command: [python, dispatcher.py]
        args:
          - --stage
          - classify
          - --in-dir
          - /workspace/data
          - --out-dir
          - /workspace/data
        env:
          - name: LOG_LEVEL
            value: "{{workflow.parameters.log_level}}"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "2000m"

# ── Notes ────────────────────────────────────────────────────────────────────
#
# Deployment approach (used in this workflow):
#
#   The workflow uses a SINGLE custom Docker image approach with a unified
#   dispatcher pattern:
#
#   1. dispatcher.py – routes CLI invocations to stage functions
#      Usage: python dispatcher.py --stage <fetch|preprocess|classify> [--in-dir ...] [--out-dir ...]
#
#   2. All Python stage modules (stage1_fetch.py, stage2_preprocess.py, etc.)
#      are included in the Docker image and imported by dispatcher.py
#
#   3. Build and push the custom image:
#        docker build -t myregistry/classifier:1.0 .
#        docker push myregistry/classifier:1.0
#
#   4. Submit the workflow with the custom image:
#        argo submit image-classify-workflow.yaml \
#          -p docker_image=myregistry/classifier:1.0 \
#          --watch
#
#   Benefits:
#   - No inline scripts or ConfigMap mounts needed
#   - Eliminates per-pod pip installs (all deps pre-packaged)
#   - Clean separation of concerns (dispatcher handles routing)
#   - Faster execution at scale
#   - Easier to test locally: docker run myregistry/classifier:1.0 --help
#
# Artifact store (for multi-cluster or persistent results):
#   Replace the shared emptyDir volume with Argo artifact configuration
#   pointing at MinIO or S3.  Stage outputs become named artifacts:
#     outputs:
#       artifacts:
#         - name: manifest
#           path: /workspace/data/manifest.json
#           s3: { bucket: my-bucket, key: "{{workflow.name}}/manifest.json" }
#
# Scaling:
#   To classify a large batch, replace Stage 2 and 3 with withItems loops
#   so each image is preprocessed and classified in a separate parallel pod.
