# image-classify-workflow.yaml
#
# Multi-stage Argo Workflow: Pretrained Image Classification with MobileNetV2
#
# Stages:
#   1. fetch      – download model (mobilenetv2-12.onnx), ImageNet labels,
#                   and sample images (packaged as IVCAP artifacts)
#   2. preprocess – resize + centre-crop + normalise each image → .npy tensors
#   3. classify   – run ONNX Runtime inference, write result.ivcap.json
#
# All stages share a single emptyDir volume (/workspace) so no external
# artifact store (S3/MinIO) is required for a self-contained demo.
# Each stage is a separate Kubernetes Pod.
#
# All stages use a single custom Docker image that includes dispatcher.py
# and all Python stage modules, eliminating the need for inline scripts or
# ConfigMap mounts.
#
# Prerequisites:
#   kubectl apply -n argo -f https://github.com/argoproj/argo-workflows/releases/latest/download/install.yaml
#
# Usage:
#   argo submit image-classify-workflow.yaml --watch
#   argo submit image-classify-workflow.yaml \
#     -p images_artifact_urn=urn:ivcap:artifact:xxx \
#     -p model_artifact_urn=urn:ivcap:artifact:yyy \
#     --watch
#
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: image-classify-
  labels:
    demo: mobilenetv2-onnx
spec:
  # ── Global settings ──────────────────────────────────────────────────────────
  entrypoint: pipeline

  arguments:
    parameters:
      # IVCAP artifact URNs for images and model (required parameters)
      - name: images_artifact_urn
      - name: model_artifact_urn

  # Shared volume: all three pods mount this at /workspace
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 500Mi   # model ~13 MB + images + tensors, headroom to spare

  # ── Top-level pipeline ───────────────────────────────────────────────────────
  templates:
    - name: pipeline
      steps:
        # Stage 1 runs first, alone
        - - name: fetch
            template: fetch-model-and-images

        # Stage 2 runs after Stage 1 completes
        - - name: preprocess
            template: preprocess-images

        # Stage 3 runs after Stage 2 completes
        - - name: classify
            template: classify-images

      # Propagate the classify step's result to the workflow-level outputs so
      # the IVCAP Argo controller can read it via wf.Status.Outputs.Parameters.
      outputs:
        parameters:
          - name: result
            valueFrom:
              parameter: "{{steps.classify.outputs.parameters.result}}"

    # ── Stage 1: Fetch ──────────────────────────────────────────────────────────
    - name: fetch-model-and-images
      metadata:
        labels:
          stage: "1-fetch"
      container:
        image: "@DOCKER_IMAGE@"
        command: ["./run.sh"]
        args:
          - --stage
          - fetch
          - --images-artifact-urn
          - "{{workflow.parameters.images_artifact_urn}}"
          - --model-artifact-urn
          - "{{workflow.parameters.model_artifact_urn}}"
          - --out-dir
          - /workspace/data
        env:
          - name: LOG_LEVEL
            value: "INFO"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

    # ── Stage 2: Preprocess ─────────────────────────────────────────────────────
    - name: preprocess-images
      metadata:
        labels:
          stage: "2-preprocess"
      container:
        image: "@DOCKER_IMAGE@"
        command: ["./run.sh"]
        args:
          - --stage
          - preprocess
          - --in-dir
          - /workspace/data
          - --out-dir
          - /workspace/data
        env:
          - name: LOG_LEVEL
            value: "INFO"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1000m"

    # ── Stage 3: Classify ───────────────────────────────────────────────────────
    - name: classify-images
      metadata:
        labels:
          stage: "3-classify"
      container:
        image: "@DOCKER_IMAGE@"
        command: ["./run.sh"]
        args:
          - --stage
          - classify
          - --in-dir
          - /workspace/data
          - --out-dir
          - /workspace/data
        env:
          - name: LOG_LEVEL
            value: "INFO"
          # Tells stage3_classify.py where to write the IVCAP result file.
          # Must match the path declared in outputs.parameters below.
          - name: IVCAP_RESULT_PATH
            value: "/result.ivcap.json"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "2000m"
      # Argo reads /result.ivcap.json after the container exits and stores its
      # content in the workflow outputs — the IVCAP controller picks it up from
      # wf.Status.Outputs.Parameters["result"].Value (max 256 KB via etcd).
      outputs:
        parameters:
          - name: result
            valueFrom:
              path: /result.ivcap.json
