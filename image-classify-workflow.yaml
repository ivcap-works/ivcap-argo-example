# image-classify-workflow.yaml
#
# Multi-stage Argo Workflow: Bird Species Classification with EfficientNetB2
#
# Stages:
#   1. fetch      – download EfficientNetB2 model (from IVCAP artifact) and bird
#                   images (from an IVCAP collection — each image is a standalone
#                   artifact created by prepare_data.py / make prepare-data)
#                   onto the shared workspace volume
#   2. preprocess – run each image through EfficientNetImageProcessor → .npy tensors
#   3. classify   – run PyTorch inference with EfficientNetForImageClassification,
#                   write top-5 bird species predictions to result.ivcap.json
#
# The EfficientNetB2 model is stored as an IVCAP artifact (never baked into the
# Docker image). Create the model artifact once with: make prepare-model
#
# Images are stored as individual IVCAP artifacts grouped in a collection.
# Create the collection once with: make prepare-data
#
# All stages share a single emptyDir volume (/workspace) so no external
# artifact store (S3/MinIO) is required for a self-contained demo.
# Each stage is a separate Kubernetes Pod.
#
# All stages use a single custom Docker image that includes dispatcher.py
# and all Python stage modules, eliminating the need for inline scripts or
# ConfigMap mounts.
#
# Prerequisites:
#   kubectl apply -n argo -f https://github.com/argoproj/argo-workflows/releases/latest/download/install.yaml
#
# Usage:
#   argo submit image-classify-workflow.yaml --watch
#   argo submit image-classify-workflow.yaml \
#     -p collection_urn=urn:ivcap:collection:xxx \
#     -p model_artifact_urn=urn:ivcap:artifact:yyy \
#     --watch
#
#   # Process only the first 10 images:
#   argo submit image-classify-workflow.yaml \
#     -p collection_urn=urn:ivcap:collection:xxx \
#     -p model_artifact_urn=urn:ivcap:artifact:yyy \
#     -p limit=10 \
#     --watch
#
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: bird-classify-
  labels:
    demo: efficientnetb2-birds
spec:
  # ── Global settings ──────────────────────────────────────────────────────────
  entrypoint: pipeline

  arguments:
    parameters:
      # URN of the IVCAP collection containing individual bird image artifacts
      # (created by prepare_data.py / make prepare-data)
      - name: collection_urn
      # URN of the EfficientNetB2 model artifact (created by make prepare-model)
      - name: model_artifact_urn
      # Optional: maximum number of images to process from the collection.
      # Set to 0 (default) to process all images.
      - name: limit
        value: "0"

  # Shared volume: all three pods mount this at /workspace
  # EfficientNetB2 model (~35 MB) + images + tensors — 2 Gi gives comfortable headroom
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi

  # ── Top-level pipeline ───────────────────────────────────────────────────────
  templates:
    - name: pipeline
      steps:
        # Stage 1 runs first, alone
        - - name: fetch
            template: fetch-model-and-images

        # Stage 2 runs after Stage 1 completes
        - - name: preprocess
            template: preprocess-images

        # Stage 3 runs after Stage 2 completes
        - - name: classify
            template: classify-images

      # Propagate the classify step's result to the workflow-level outputs so
      # the IVCAP Argo controller can read it via wf.Status.Outputs.Parameters.
      outputs:
        parameters:
          - name: result
            valueFrom:
              parameter: "{{steps.classify.outputs.parameters.result}}"

    # ── Stage 1: Fetch ──────────────────────────────────────────────────────────
    - name: fetch-model-and-images
      metadata:
        labels:
          stage: "1-fetch"
      container:
        image: "@DOCKER_IMAGE@"
        command: ["./run.sh"]
        args:
          - --stage
          - fetch
          - --collection-urn
          - "{{workflow.parameters.collection_urn}}"
          - --model-artifact-urn
          - "{{workflow.parameters.model_artifact_urn}}"
          - --limit
          - "{{workflow.parameters.limit}}"
          - --out-dir
          - /workspace/data
        env:
          - name: LOG_LEVEL
            value: "INFO"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

    # ── Stage 2: Preprocess ─────────────────────────────────────────────────────
    - name: preprocess-images
      metadata:
        labels:
          stage: "2-preprocess"
      container:
        image: "@DOCKER_IMAGE@"
        command: ["./run.sh"]
        args:
          - --stage
          - preprocess
          - --in-dir
          - /workspace/data
          - --out-dir
          - /workspace/data
        env:
          - name: LOG_LEVEL
            value: "INFO"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

    # ── Stage 3: Classify ───────────────────────────────────────────────────────
    - name: classify-images
      metadata:
        labels:
          stage: "3-classify"
      container:
        image: "@DOCKER_IMAGE@"
        command: ["./run.sh"]
        args:
          - --stage
          - classify
          - --in-dir
          - /workspace/data
          - --out-dir
          - /workspace/data
        env:
          - name: LOG_LEVEL
            value: "INFO"
          # Tells stage3_classify.py where to write the IVCAP result file.
          # Must match the path declared in outputs.parameters below.
          - name: IVCAP_RESULT_PATH
            value: "/result.ivcap.json"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
      # Argo reads /result.ivcap.json after the container exits and stores its
      # content in the workflow outputs — the IVCAP controller picks it up from
      # wf.Status.Outputs.Parameters["result"].Value (max 256 KB via etcd).
      outputs:
        parameters:
          - name: result
            valueFrom:
              path: /result.ivcap.json
