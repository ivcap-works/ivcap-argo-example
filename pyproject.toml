[tool.poetry]
name = "image-classify-app"
version = "0.1.0"
description = "Bird Species Classification Pipeline using EfficientNetB2 (HuggingFace Transformers)"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false


# NOTE: torch is intentionally NOT pinned to the pytorch-cpu source here.
# The Dockerfile handles CPU-only torch via:
#   pip install "torch>=2.0.0" --index-url https://download.pytorch.org/whl/cpu
# ...before Poetry runs, so Poetry just sees torch already installed and skips it.
# On macOS (dev), PyPI torch for arm64 is already CUDA-free — no pytorch-cpu needed.
# Pinning source = "pytorch-cpu" breaks macOS resolution because that index uses
# version suffixes (+cpu) only for Linux wheels, causing Poetry to fail on arm64.

[tool.poetry.dependencies]
python = "^3.11"
pillow = "^10.0.0"
numpy = "^1.24.0"
transformers = "^4.35.0"
torch = ">=2.0.0"
torchvision = ">=0.15.0"
safetensors = ">=0.3.0"
ivcap-client = "^0.47.14"
pydantic = "^2.13.4"



[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.4.0"
datasets = ">=3.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
